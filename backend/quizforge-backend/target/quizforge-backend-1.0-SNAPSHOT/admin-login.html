<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuizForge | Admin Login</title>

    <link rel="stylesheet"
          href="CSS/style.css">

</head>

<body class="auth-container">

    <div class="admin-login-card">

        <span class="admin-login-badge">
            QUIZFORGE ADMIN
        </span>

        <div class="admin-login-icon">
            🔐
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="admin-login-description">
            Sign in with your administrator account
            to manage QuizForge questions.
        </p>


        <div
            id="loginError"
            class="admin-login-error"
            style="display: none;">

            Invalid admin email or password.

        </div>


        <form
            action="admin-login"
            method="post"
            class="admin-login-form">

            <div class="admin-login-field">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required>

            </div>


            <div class="admin-login-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required>

            </div>


            <button
                type="submit"
                class="admin-login-button">

                Login as Admin

            </button>

        </form>


        <a
            href="index.html"
            class="admin-login-back">

            ← Back to Home

        </a>

    </div>


    <script>

        const params =
                new URLSearchParams(
                        window.location.search
                );

        if (params.get("error") === "true") {

            document.getElementById(
                    "loginError"
            ).style.display = "block";
        }

    </script>

</body>

</html>
