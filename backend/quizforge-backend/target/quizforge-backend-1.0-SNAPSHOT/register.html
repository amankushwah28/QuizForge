<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - QuizForge</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <a href="index.html" class="auth-logo">
                QuizForge
            </a>

            <h1>Create Account</h1>

            <p class="auth-description">
                Start your Personalised learning journey.
            </p>


            <form
                id="registerForm"
                action="http://localhost:8080/quizforge-backend-1.0-SNAPSHOT/register"
                method="POST"
                novalidate
            >

                <!-- Full Name -->

                <input
                    type="text"
                    id="name"
                    name="fullName"
                    placeholder="Full Name"
                    required
                >


                <!-- Username -->

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Username"
                    required
                >


                <!-- Gmail -->

                <input
                    type="email"
                    id="registerEmail"
                    name="email"
                    placeholder="Gmail Address"
                    required
                >


                <!-- Password -->

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Password"
                    required
                >


                <!-- Confirm Password -->

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="switch-page">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                Back to Home
            </a>

        </div>

    </div>


    <script src="JS/script.js"></script>

</body>

</html>
