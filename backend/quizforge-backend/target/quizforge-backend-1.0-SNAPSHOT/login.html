<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate">

    <meta http-equiv="Pragma"
      content="no-cache">

    <meta http-equiv="Expires"
      content="0">

    <title>Login - QuizForge</title>

    <link rel="stylesheet"
          href="CSS/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <!-- LOGO -->

            <a href="index.html"
               class="auth-logo">

                QuizForge

            </a>


            <!-- HEADING -->

            <h1>
                Welcome Back 👋
            </h1>

            <p class="auth-description">

                Login to continue your
                learning journey.

            </p>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                action="login"
                method="POST">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter your email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter your password"
                    required>


                <!-- FORM OPTIONS -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>


            <!-- REGISTER -->

            <p class="switch-page">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <!-- HOME -->

            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>


            <!-- ADMIN LOGIN -->

            <div class="admin-login-link">

                <span>
                    Are you an administrator?
                </span>

                <a href="admin-login.html">
                    Admin Login
                </a>

            </div>

        </div>

    </div>


    <script src="JS/script.js"></script>

</body>

</html>
